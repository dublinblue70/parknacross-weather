name: Diagnose live Android PWA installability
on:
  push:
    branches: [codex/pwa-webapk-check-20261118]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/check-live-pwa-installability.mjs
