name: Website release checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node tests/site-release-integrity.test.mjs
      - run: node tests/whole-site-structure.test.mjs
      - run: node tests/published-release.test.mjs
      - run: node tests/rain-pipeline-monitor.test.mjs
      - run: node tests/wh52-upload-monitor.test.mjs
      - run: node tests/audit-20261106.test.mjs
      - run: node tests/m2-observation-context.test.mjs
      - run: node tests/soil-archive-baseline.test.mjs
      - run: npm run test:smoke
      - run: npm run test:worker-export-range
      - run: npm run test:release
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:release-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-visual-evidence
          path: |
            test-results/**/*.png
            test-results/**/*.jpg
            test-results/**/*.json
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run test:pwa-browser
