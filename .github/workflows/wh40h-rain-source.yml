name: WH40H rain-source verification
on:
  push:
    branches: [main]
    paths:
      - '_worker/worker.mjs'
      - 'station.html'
      - 'status.html'
      - 'status.js'
      - 'status-ui.js'
      - 'tests/wh40h-health.test.mjs'
      - 'station-page.js'
      - 'rain.html'
      - 'history.html'
      - 'downloads.html'
      - 'admin.html'
      - 'tests/wh40h-rain-source.test.mjs'
      - '.github/workflows/wh40h-rain-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check _worker/worker.mjs
      - run: node --check app.js
      - run: node --check rain.js
      - run: node --check status.js
      - run: node --check status-ui.js
      - run: node tests/wh40h-rain-source.test.mjs
      - run: node tests/wh40h-health.test.mjs
      - name: Inspect public live rain fields (read-only)
        run: |
          node --input-type=module <<'JS'
          const endpoint = "https://parknacross-weather.dave-s-carter.workers.dev/current";
          try {
            const response = await fetch(endpoint, {signal: AbortSignal.timeout(15000), headers: {Accept:"application/json"}});
            const data = await response.json();
            const fields = ["epoch","received_at","source","rain_rate_mm_h","rain_daily_mm","piezo_rain_rate_mm_h","piezo_daily_mm","piezo_observed_epoch"];
            const report = Object.fromEntries(fields.map(key=>[key,data?.[key]??null]));
            console.log("PUBLIC_RAIN_DIAGNOSTIC",JSON.stringify({http_status:response.status,...report}));
          } catch (error) {
            console.log("PUBLIC_RAIN_DIAGNOSTIC_ERROR",String(error));
          }
          JS
