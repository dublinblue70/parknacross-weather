name: WH40H rain-source verification
on:
  push:
    branches: [main]
    paths:
      - '_worker/worker.mjs'
      - 'station.html'
      - 'station-page.js'
      - 'rain.html'
      - 'history.html'
      - 'downloads.html'
      - 'admin.html'
      - 'tests/wh40h-rain-source.test.mjs'
      - '.github/workflows/wh40h-rain-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/wh40h-rain-source.test.mjs
