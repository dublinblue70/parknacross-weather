name: Website release checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:smoke
      - run: npm run test:worker-export-range
      - run: npm run test:release
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:release-browser
      - run: npm run test:pwa-browser
